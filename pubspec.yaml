name: arete
description: ARETE — a fitness training platform. Phase 1 (Android first, iOS next).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  # Version deferred to whatever flutter_localizations pins for the SDK, so the
  # two never conflict across Flutter stable releases.
  intl: any
  flutter_local_notifications: ^17.2.3
  # Required by flutter_local_notifications' zonedSchedule (daily reminders at
  # a fixed time of day). Kept on the same 0.9.x line the plugin itself pins.
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  http: ^1.2.2
  qr_flutter: ^4.1.0
  # A modern build is required: 5.x throws a native NPE on current toolchains,
  # and 6.x can fail to start the camera on some devices ("unexpected error").
  # Allow 7.x, which is the version that worked; the earlier <7 cap was a wrong
  # guess at a CI failure that was actually a GitHub account/Actions issue.
  mobile_scanner: ">=7.0.0 <8.0.0"
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon (generated from the brand art in assets/branding).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/arete_icon.png"
  adaptive_icon_background: "#0E1216"
  adaptive_icon_foreground: "assets/branding/arete_icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
