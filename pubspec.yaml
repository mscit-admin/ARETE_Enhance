name: arete
description: ARETE — a fitness training platform. Phase 1 (Android first, iOS next).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon (generated from the brand art in assets/branding).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/arete_icon.png"
  adaptive_icon_background: "#0E1216"
  adaptive_icon_foreground: "assets/branding/arete_icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
