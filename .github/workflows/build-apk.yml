name: Build Android APK

# Builds a debug and a release APK on every push to the feature/main branches,
# and on demand from the Actions tab. The generated APKs are uploaded as
# downloadable artifacts.
on:
  push:
    branches:
      - claude/fitness-app-phase-1-design-3jz9c6
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The android/ platform folder is generated on the fly so the repo stays
      # lean. This preserves everything under lib/ and test/.
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org fit.arete .
          # Remove the default template test that flutter create adds; the repo
          # ships its own tests under test/.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      # Quality gates run but do not block the APK build, so you always get an
      # artifact to try. Tighten to fatal once the codebase settles.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arete-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arete-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
